<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧树题库 · 广东工业大学</title>
<style>
/* ====== Reset & Variables ====== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --c-bg:#f0f2f5; --c-surface:#fff; --c-text:#1a1a2e; --c-text2:#666; --c-text3:#999;
  --c-accent:#2563eb; --c-accent2:#1d4ed8; --c-accent-light:#eff6ff;
  --c-panduan:#f59e0b; --c-danxuan:#10b981; --c-duoxuan:#8b5cf6;
  --c-danger:#ef4444; --c-success:#10b981;
  --radius:12px; --radius-sm:8px; --radius-xs:6px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --transition:0.2s cubic-bezier(.4,0,.2,1);
  --sidebar-w:260px; --schoolbar-w:64px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.6;overflow:hidden;height:100vh}
a{color:var(--c-accent);text-decoration:none}

/* ====== App Shell ====== */
#app{display:flex;height:100vh}

/* ====== School Bar (leftmost) ====== */
#schoolBar{
  width:var(--schoolbar-w);background:#1e293b;color:#fff;
  display:flex;flex-direction:column;align-items:center;padding:16px 0;
  flex-shrink:0;z-index:30;
}
#schoolBar .logo{width:40px;height:40px;border-radius:var(--radius-sm);background:var(--c-accent);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:20px;font-weight:700}
.school-item{
  width:48px;height:48px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:var(--transition);font-size:13px;font-weight:600;
  color:#94a3b8;margin-bottom:4px;position:relative;
}
.school-item:hover{background:#334155;color:#e2e8f0}
.school-item.active{background:var(--c-accent);color:#fff}
.school-item .tooltip{
  position:absolute;left:60px;background:#1e293b;color:#fff;padding:6px 12px;
  border-radius:var(--radius-xs);font-size:12px;white-space:nowrap;pointer-events:none;
  opacity:0;transform:translateX(-4px);transition:var(--transition);z-index:100;
}
.school-item:hover .tooltip{opacity:1;transform:translateX(0)}

/* ====== Sidebar (courses + modules) ====== */
#sidebar{
  width:var(--sidebar-w);background:var(--c-surface);border-right:1px solid #e5e7eb;
  display:flex;flex-direction:column;flex-shrink:0;z-index:20;overflow:hidden;
}
.sidebar-header{
  padding:16px 20px;border-bottom:1px solid #e5e7eb;
  display:flex;align-items:center;gap:10px;
}
.sidebar-header .back-btn{
  width:32px;height:32px;border-radius:50%;border:1px solid #e5e7eb;
  background:var(--c-surface);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:var(--transition);font-size:16px;color:var(--c-text2);
}
.sidebar-header .back-btn:hover{background:#f1f5f9;border-color:#cbd5e1}
.sidebar-header .title{font-weight:700;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-body{flex:1;overflow-y:auto;padding:8px 0}

/* Course cards in sidebar */
.course-card{
  margin:6px 12px;padding:12px 14px;border-radius:var(--radius-sm);
  cursor:pointer;transition:var(--transition);border:1px solid #e5e7eb;
  display:flex;align-items:center;gap:10px;
}
.course-card:hover{border-color:var(--c-accent);background:var(--c-accent-light)}
.course-card.active{border-color:var(--c-accent);background:var(--c-accent-light)}
.course-card .course-icon{width:36px;height:36px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.course-card .course-info{flex:1;min-width:0}
.course-card .course-name{font-size:13px;font-weight:600;line-height:1.3}
.course-card .course-meta{font-size:11px;color:var(--c-text3);margin-top:2px}

/* Module list */
.module-label{padding:8px 20px 4px;font-size:11px;color:var(--c-text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.mod-btn{
  display:flex;justify-content:space-between;align-items:center;width:100%;
  padding:8px 20px;border:none;background:transparent;cursor:pointer;
  font-size:13px;text-align:left;transition:var(--transition);color:var(--c-text2);
  gap:8px;
}
.mod-btn:hover{background:#f1f5f9;color:var(--c-accent)}
.mod-btn.active{background:var(--c-accent-light);color:var(--c-accent);font-weight:600;border-right:3px solid var(--c-accent)}
.mod-btn .count{background:#e5e7eb;color:var(--c-text3);border-radius:10px;padding:1px 8px;font-size:11px;flex-shrink:0}
.mod-btn.active .count{background:var(--c-accent);color:#fff}

/* ====== Main Content ====== */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-header{
  background:var(--c-surface);border-bottom:1px solid #e5e7eb;
  padding:14px 24px;display:flex;align-items:center;gap:16px;flex-shrink:0;
  z-index:10;
}
.main-header .breadcrumb{font-size:13px;color:var(--c-text3);display:flex;align-items:center;gap:6px}
.main-header .breadcrumb span{color:var(--c-text2)}
.main-header .breadcrumb .current{color:var(--c-text);font-weight:600}
.main-body{flex:1;overflow-y:auto;padding:20px 24px}

/* Stats bar */
.stats-bar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.stat-chip{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.stat-chip.all{background:#e5e7eb;color:var(--c-text2)}
.stat-chip.panduan{background:#fef3c7;color:#92400e}
.stat-chip.danxuan{background:#d1fae5;color:#065f46}
.stat-chip.duoxuan{background:#ede9fe;color:#5b21b6}

/* Toolbar */
.toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
#searchBox{
  flex:1;min-width:200px;padding:10px 16px;border:1px solid #e5e7eb;border-radius:24px;
  font-size:14px;outline:none;transition:var(--transition);background:var(--c-surface);
}
#searchBox:focus{border-color:var(--c-accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.filter-btn{
  padding:8px 16px;border:1px solid #e5e7eb;border-radius:20px;
  background:var(--c-surface);cursor:pointer;font-size:13px;transition:var(--transition);
  color:var(--c-text2);white-space:nowrap;
}
.filter-btn:hover{border-color:var(--c-accent);color:var(--c-accent)}
.filter-btn.active{background:var(--c-accent);color:#fff;border-color:var(--c-accent)}
#moduleSelect{
  padding:8px 12px;border:1px solid #e5e7eb;border-radius:20px;font-size:13px;
  outline:none;cursor:pointer;background:var(--c-surface);color:var(--c-text2);
  max-width:180px;
}

/* Question card */
.q-card{
  background:var(--c-surface);border-radius:var(--radius);padding:20px 24px;
  margin-bottom:14px;box-shadow:var(--shadow);transition:var(--transition);
  border-left:4px solid var(--c-accent);
}
.q-card.判断题{border-left-color:var(--c-panduan)}
.q-card.单选题{border-left-color:var(--c-danxuan)}
.q-card.多选题{border-left-color:var(--c-duoxuan)}
.q-card:hover{box-shadow:var(--shadow-md)}
.q-head{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.q-tag{padding:3px 10px;border-radius:var(--radius-xs);font-size:11px;font-weight:700;color:#fff}
.q-tag.判断题{background:var(--c-panduan)}
.q-tag.单选题{background:var(--c-danxuan)}
.q-tag.多选题{background:var(--c-duoxuan)}
.q-module{font-size:12px;color:var(--c-text3);background:#f1f5f9;padding:2px 8px;border-radius:4px}
.q-num{font-size:12px;color:var(--c-text3);margin-left:auto}
.q-text{font-size:15px;font-weight:500;margin-bottom:12px;line-height:1.7}
.q-opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.q-opt{
  padding:5px 12px;border-radius:var(--radius-xs);background:#f8fafc;
  border:1px solid #e5e7eb;font-size:13px;transition:var(--transition);
}
.q-opt.is-answer{background:#d1fae5;border-color:#6ee7b7;font-weight:600}
.q-answer{
  background:#f0fdf4;border-radius:var(--radius-sm);padding:10px 14px;
  margin-top:8px;font-size:13px;border:1px solid #bbf7d0;
}
.q-answer .ans-label{font-weight:700;color:#065f46;margin-right:6px}
.q-explain{
  color:var(--c-text2);font-size:12px;line-height:1.6;margin-top:6px;
  padding-left:12px;border-left:2px solid #e5e7eb;
}

/* Empty state */
.empty-state{text-align:center;padding:60px 20px;color:var(--c-text3)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.result-info{font-size:13px;color:var(--c-text3);margin-bottom:14px}

/* Welcome / course selection page */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px}
.welcome h2{font-size:24px;margin-bottom:8px}
.welcome p{color:var(--c-text2);margin-bottom:24px;text-align:center;max-width:500px}
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;width:100%;max-width:700px}
.course-tile{
  background:var(--c-surface);border-radius:var(--radius);padding:24px;
  box-shadow:var(--shadow);cursor:pointer;transition:var(--transition);
  border:2px solid transparent;text-align:center;
}
.course-tile:hover{border-color:var(--c-accent);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.course-tile .tile-icon{font-size:40px;margin-bottom:12px}
.course-tile .tile-name{font-size:17px;font-weight:700;margin-bottom:6px}
.course-tile .tile-meta{font-size:13px;color:var(--c-text3)}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#9ca3af}

/* Responsive */
@media(max-width:900px){
  #schoolBar{width:48px;padding:12px 0}
  .school-item{width:36px;height:36px;font-size:11px}
  #sidebar{width:220px}
  .main-body{padding:14px}
  .q-card{padding:14px}
}
@media(max-width:640px){
  #sidebar{display:none}
  #schoolBar{width:44px}
  .main-header{padding:10px 14px}
}
</style>
</head>
<body>

  <!-- Main -->
  <main id="main">
    <div class="main-header">
      <div class="breadcrumb" id="breadcrumb"></div>

    <div class="main-body" id="mainContent"></div>
  </main>
</div>

即搬动伤员到安全的地方，而不需要考虑是否会对伤员造成二次伤害。", "options": ["对.", "错."], "answer": "错", "answerText": "", "explanation": "该题强调在急救中搬动伤员的注意事项，考察学生是否掌握避免造成二次伤害的原则。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "现场急救原则", "type": "判断题", "question": "急救中，必须等待专业医疗人员到达后才能开始处理伤员的伤情。", "options": ["对.", "错."], "answer": "错", "answerText": "", "explanation": "该题考察学生对现场急救及时性原则的理解。急救应在专业医疗人员到达前尽可能采取正确措施，以争取宝贵的救治时间。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "现场急救原则", "type": "多选题", "question": "在实施现场急救时，以下哪些行为可能导致急救失败或伤者病情恶化？", "options": ["A. 未评估现场安全性直接接触伤者", "B. 错误评估伤情，使用不当急救方法", "C. 未与专业医疗服务机构联系", "D. 优先控制大出血而非检查呼吸道", "E. 对疑似骨折的伤者随意搬动"], "answer": "A、B、E", "answerText": "", "explanation": "本题旨在考察学生对错误急救行为的识别能力。选项A、B和E均为错误行为，可能导致伤者病情恶化。选项C和D是正确的急救操作，未联系医疗服务机构和优先控制出血并不属于急救失败行为。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "现场急救原则", "type": "单选题", "question": "在处理骨折急救时，以下哪种行为是错误的？", "options": ["A. 固定骨折部位", "B. 避免移动骨折部位", "C. 试图将骨折断端复位", "D. 使用支架或布条进行固定"], "answer": "C", "answerText": "", "explanation": "此题考察学生对骨折急救原则的掌握。现场急救时不应试图将骨折断端复位，这可能加重患者伤情或引发其他并发症。正确的处理方式是固定骨折部位并避免移动。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "现场急救步骤", "type": "判断题", "question": "急救时，应始终优先考虑伤者的心理安慰，以稳定其情绪。", "options": ["对.", "错."], "answer": "错", "answerText": "", "explanation": "此题考察学生对急救重点的理解，生命体征的稳定是急救的首要任务，心理安慰是次要任务。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "现场急救步骤", "type": "多选题", "question": "在处理骨折伤者时，以下哪些做法是正确的？", "options": ["A. 立即固定受伤部位", "B. 为伤者提供止痛药物", "C. 用夹板固定骨折部位并包扎", "D. 避免移动伤者受伤部位", "E. 将骨折部位复位"], "answer": "A、C、D", "answerText": "", "explanation": "骨折急救时，应避免移动受伤部位（选项D），并通过夹板固定和包扎（选项C）来减少二次损伤。立即固定受伤部位（选项A）可以稳定伤情。选项B和E则可能有潜在风险，需在医疗人员指导下操作。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "现场急救步骤", "type": "多选题", "question": "在施救过程中，以下哪些行为可能会对伤者造成二次伤害？", "op 预防", "courseId": "tiyu", "module": "运动性脱水", "type": "多选题", "question": "以下哪些情况可能加剧运动性脱水的发生？", "options": ["A. 运动时间过长。", "B. 高温环境下运动。", "C. 运动后摄入高盐食物。", "D. 运动中忽视补水。", "E. 低强度短时间运动。"], "answer": "A、B、D", "answerText": "", "explanation": "该题考察运动性脱水的加剧因素。运动时间过长、高温环境及忽视补水均会加剧脱水风险。选项C虽然可能导致电解质紊乱，但对脱水影响较小；选项E不会显著加剧脱水。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动性脱水", "type": "单选题", "question": "为了避免运动性脱水，建议运动前后补充足够的水分。以下哪种补水策略最为合理？", "options": ["A. 运动前后均匀补水，运动期间适量补充", "B. 只在运动前补水", "C. 只在运动后补水", "D. 运动期间每10分钟饮用500ml水"], "answer": "A", "answerText": "", "explanation": "此题考察学生对预防运动性脱水的有效方法的认知能力。均匀补水并在运动期间适量补充是科学的补水策略，避免脱水风险。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动性脱水", "type": "多选题", "question": "在运动性脱水的预防和处理过程中，以下方法正确的是哪些？", "options": ["A. 运动前充分补水。", "B. 运动中定时少量多次补水。", "C. 选择含电解质的运动饮料。", "D. 运动后立即大量饮水。", "E. 避免运动过程中出汗。"], "answer": "A、B、C", "answerText": "", "explanation": "该题考察运动性脱水的预防和处理方法。运动前补水、运动中定时补水以及饮用含电解质的饮料均有效，而运动后应适量补水而非大量，避免出汗是不可行的建议。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动性脱水", "type": "单选题", "question": "运动性脱水的主要原因是身体在运动过程中失去了大量水分和电解质，以下哪种行为最容易导致运动性脱水？", "options": ["A. 长时间运动且未补充水分", "B. 低强度短时间运动", "C. 运动前摄入过量盐分", "D. 运动中饮用含咖啡因饮料"], "answer": "A", "answerText": "", "explanation": "此题考察学生对运动性脱水产生原因的理解。长时间运动且未补充水分是运动性脱水的主要诱因，而其他选项则不符合主要原因。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动性脱水", "type": "多选题", "question": "运动性脱水对人体有哪些潜在危害？", "options": ["A. 降低运动表现。", "B. 增加中暑风险。", "C. 导致肌肉痉挛。", "D. 增强免疫系统功能。", "E. 增加体内脂肪含量。"], "answer": "A、B、C", "answerText": "", "explanation": "该题主要考察运动性脱水的负面影响，包括运动表现下降、中暑风险上升和肌肉痉挛等。选项D和E错误，因为脱水不会增强免疫功能或增加脂肪含量。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动性脱水", "type": "单选题", "question": "运动性脱水通常发生在剧烈运动或高强度活动后，以下哪种表现最可能提示运动性脱水？", "options": ["A. 尿液颜色较深", "B. 皮肤湿润且有弹性", "C. 体重增加", "D. 食欲增强"], "answer": " : "", "explanation": "预防运动性腹痛的主要措施包括热身、控制运动强度及节奏、避免过饱进食以及加强核心力量训练等，而服用止痛药并不是预防的常规手段。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动性贫血", "type": "单选题", "question": "运动性贫血的发生机制中，以下哪项描述是错误的？", "options": ["A. 运动引起的机械性溶血", "B. 运动导致的铁耗损增加", "C. 运动引起的血浆扩容", "D. 运动诱发的红细胞生成增加"], "answer": "D", "answerText": "", "explanation": "运动性贫血的发生机制包括机械性溶血、铁耗损增加和血浆扩容，但并不会直接诱发红细胞生成的明显增加。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动性贫血", "type": "单选题", "question": "预防运动性贫血的有效方法不包括以下哪一项？", "options": ["A. 合理控制运动量", "B. 补充富含铁的食物", "C. 定期进行血液检查", "D. 减少日常饮水量"], "answer": "D", "answerText": "", "explanation": "预防运动性贫血的方法包括控制运动量、增加铁的摄入、定期体检等，但减少饮水量对预防运动性贫血无帮助，反而可能导致脱水等问题。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动性贫血", "type": "判断题", "question": "运动性贫血只发生在高强度运动的专业运动员中。", "options": ["对.", "错."], "answer": "错", "answerText": "", "explanation": "运动性贫血不仅限于专业运动员，也可能发生在普通人群中的高强度运动或长期锻炼者。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动性贫血", "type": "判断题", "question": "运动性贫血可能导致运动员的体能下降和耐力减弱。", "options": ["对.", "错."], "answer": "对", "answerText": "", "explanation": "运动性贫血会影响血液携氧能力，进而导致体能下降和耐力减弱。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动性贫血", "type": "判断题", "question": "运动性贫血的主要表现是白细胞数量减少。", "options": ["对.", "错."], "answer": "错", "answerText": "", "explanation": "运动性贫血主要表现为红细胞数量减少和血红蛋白浓度降低，而与白细胞数量无直接关系。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动性贫血", "type": "单选题", "question": "以下哪种情况最可能提示发生了运动性贫血？", "options": ["A. 运动后心率加快但迅速恢复", "B. 运动后出现持续性疲劳和头晕", "C. 运动后肌肉酸痛", "D. 运动中突发剧烈胸痛"], "answer": "B", "answerText": "", "explanation": "运动性贫血的症状通常表现为持续性疲劳、头晕、注意力不集中等，不会出现突发性剧烈胸痛。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动性贫血", "type": "单选题", "question": "运动性贫血通常与以下哪种矿物质的缺乏无关？", "options": ["A. 铁", "B. 钙", "C. 铜", "D. 锌"], "answer": "B", "answerText": "", "explanation": "运动性贫血主要与铁缺乏有关，可能也涉及到铜和锌的代谢，但与钙的缺乏无直接关系。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动性贫血", "type": "多选题", "question": "以下哪些关于运动性贫血的描述是正确的？", "options": ["A. 运动性贫血是由于运动导致的红细胞破坏增加或者血红蛋白减少引起的贫血现象。", "B. 运动性贫血通常发生在高强度耐力运动的运动员中。", "C. 运动性贫血与铁的摄入量无关。", "D. 运动性贫血的表现可能包括疲劳、运动能力下降等症状。", "E. 运动性贫血可以通过合理膳食和补铁来改善。"], "answer": "A、B、D、E", "answerText": "", "explanation": "该题考察学生对运动性贫血的定义、发生原因、症状及干预方法的认知。运动性贫血通常见于高强度耐力运动，可能与铁缺乏相关，合理的膳食和补铁可以缓解症状。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动性贫血", "type": "多选题", "question": "以下哪些措施有助于预防或缓解运动性贫血？", "options": ["A. 增加膳食中富含铁的食物摄入，如红肉、绿叶蔬菜等。", "B. 补充维生素C以促进铁的吸收。", "C. 减少运动强度以降低红细胞破坏风险。", "D. 定期监测血液指标以及时发现贫血问题。", "E. 完全避免高强度运动以防止运动性贫血。"], "answer": "A、B、C、D", "answerText": "", "explanation": "合理饮食、维生素C补充、适当调整运动强度和定期监测是预防运动性贫血的有效措施。选项E不正确，因为适当锻炼对健康仍然是必要的，完全避免高强度运动并不现实。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动性贫血", "type": "单选题", "question": "运动性贫血的主要原因是什么？", "options": ["A. 过量运动引起的红细胞破裂", "B. 缺乏铁元素导致红细胞减少", "C. 遗传因素导致的红细胞异常", "D. 运动中代谢废物积累导致血液毒性"], "answer": "A", "answerText": "", "explanation": "运动性贫血通常是由于过量运动导致的红细胞破裂，尤其是在长时间高强度运动时，红细胞在毛细血管中受机械性损伤而破裂。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动性贫血", "type": "多选题", "question": "关于运动性贫血的成因，以下哪些选项是正确的？", "options": ["A. 运动过程中红细胞的机械性破坏增加。", "B. 运动导致血浆容量的相对增加，稀释了血液。", "C. 运动使骨髓的造血功能受到抑制。", "D. 运动导致体内铁的流失增加。", "E. 运动引起的过度出汗可能导致铁元素的流失。"], "answer": "A、B、D、E", "answerText": "", "explanation": "运动性贫血的成因包括机械性红细胞破坏、血浆容量增加造成的稀释效应、铁流失增加等。选项C不正确，因为运动不会直接抑制骨髓造血功能。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动性贫血", "type": "判断题", "question": "运动性贫血是由于运动过程中血液中的红细胞破坏增加而导致的。", "options": ["对.", "错."], "answer": "对", "answerText": "", "explanation": "运动性贫血通常与红细胞破坏增加有关，例如跑步时脚部反复冲击可能会导致红细胞破裂。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动性贫血", "type": "多选题", "question": "运动性贫血对运动员的影响可能包括哪些方面？", "options": ["A. 运动耐力下降。", "B. 恢复能力减弱。", "C. 氧气运输能力降低。", "D. 肝功能显著减退。", "E. 比赛成绩受到负面影响。"], "answer": "A、B、C、E", "answerText": "", "explanation": "运动性贫血会导致氧气运输能力下降，进而影响运动耐力、恢复能力和比赛成绩。选项D不正确，因为运动性贫血与肝功能减退无直接关系。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动性贫血", "type": "判断题", "question": "通过合理的饮食补充铁元素可以帮助预防运动性贫血。", "options": ["对.", "错."], "answer": "对", "answerText": "", "explanation": "铁元素是血红蛋白的重要组成部分，合理的饮食补充铁元素可以有效预防运动性贫血。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动性贫血", "type": "多选题", "question": "运动性贫血的诊断和评估方法包括哪些？", "options": ["A. 检测血红蛋白浓度。", "B. 评估红细胞压积水平。", "C. 测量血清铁和铁蛋白水平。", "D. 进行运动能力测试以评估贫血对运动表现的影响。", "E. 通过核磁共振成像直接观察红细胞数量。"], "answer": "A、B、C、D", "answerText": "", "explanation": "诊断运动性贫血通常涉及血液检测（如血红蛋白、红细胞压积、血清铁）和运动能力评估。核磁共振成像并非用于直接观察红细胞数量，因此E选项不正确。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动损伤概论", "type": "多选题", "question": "关于运动损伤的特点和影响，下列说法正确的是：", "options": ["A. 运动损伤主要发生在肌肉、筋膜和关节囊等软组织部位", "B. 急性损伤比慢性损伤更常见", "C. 运动损伤可能导致运动寿命缩短", "D. 运动损伤与运动项目和技术动作水平密切相关", "E. 运动损伤一般不会影响心理健康"], "answer": "A、C、D", "answerText": "", "explanation": "本题考察了运动损伤的特征和影响。运动损伤主要发生在软组织部位（选项A正确）；急性损伤少于慢性损伤（选项B错误）；运动寿命可能因损伤缩短（选项C正确）；运动损伤与运动项目和技术动作水平有密切关系（选项D正确）；运动损伤可能对心理健康产生负面影响（选项E错误）。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动损伤概论", "type": "判断题", "question": "运动损伤通常由身体素质差、动作不正确或缺乏自我保护能力等原因引起。", "options": ["对.", "错."], "answer": "对", "answerText": "", "explanation": "本题考察学生对运动损伤主要成因的理解。根据知识点描述，运动损伤可能由训练水平不够、身体素质差、动作不正确、缺乏自我保护能力等因素导致，正确答案为“对”。", "num": 0, "points": 0}, {"course": "大二体育理论——运动损伤与预防", "courseId": "tiyu", "module": "运动损伤概论", "type": "多选题", "question": "以下关于运动损伤的急性损伤前期处理原则的说法，哪些是正确的？", "options": ["A. 在24小时内，应采用冷敷处理受伤部位以减少炎症。", "B. 急性损伤的处理应包括止血、防肿和减轻疼痛。", "C. 运动 // ══════════ STATE ══════════
let currentSchool = null;
let currentCourse = null;
let currentModule = 'all';
let currentType = 'all';
let searchTerm = '';

// ══════════ UTILS ══════════
function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══════════ COMPUTED ══════════
function getModules(courseId) {
  const school = SCHOOLS.find(s => s.id === currentSchool);
  if (!school) return [];
  const course = school.courses.find(c => c.id === courseId);
  return course ? course.modules : [];
}

function getModuleCount(courseId, moduleName) {
  return ALL_Q.filter(q => q.courseId === courseId && q.module === moduleName).length;
}

function getCourseQuestions(courseId) {
  return ALL_Q.filter(q => q.courseId === courseId);
}

function getFilteredQuestions() {
  let qs = ALL_Q;
  if (currentCourse) qs = qs.filter(q => q.courseId === currentCourse);
  if (currentModule !== 'all') qs = qs.filter(q => q.module === currentModule);
  if (currentType !== 'all') qs = qs.filter(q => q.type === currentType);
  if (searchTerm) {
    const s = searchTerm.toLowerCase();
    qs = qs.filter(q =>
      q.question.toLowerCase().includes(s) ||
      q.answer.toLowerCase().includes(s) ||
      q.answerText.toLowerCase().includes(s) ||
      q.explanation.toLowerCase().includes(s) ||
      q.module.toLowerCase().includes(s)
    );
  }
  return qs;
}

// ══════════ RENDER ══════════
function renderSchoolBar() {
  const el = document.getElementById('schoolList');
  // Sort schools alphabetically by name
  const sorted = [...SCHOOLS].sort((a,b) => a.name.localeCompare(b.name, 'zh'));
  el.innerHTML = sorted.map(s => {
    const initials = s.name.replace(/[^\u4e00-\u9fa5]/g, '').slice(0, 1);
    return `<div class="school-item${currentSchool === s.id ? ' active' : ''}"
                onclick="selectSchool('${s.id}')" title="${s.name}">
              ${initials || s.short}
              <span class="tooltip">${s.name}</span>
            </div>`;
  }).join('');
}

function selectSchool(schoolId) {
  currentSchool = schoolId;
  currentCourse = null;
  currentModule = 'all';
  renderAll();
}

function selectCourse(courseId) {
  currentCourse = courseId;
  currentModule = 'all';
  currentType = 'all';
  searchTerm = '';
  renderAll();
}

function selectModule(mod) {
  currentModule = mod;
  renderMain();
  renderSidebar();
}

function renderAll() {
  renderSchoolBar();
  renderSidebar();
  renderMain();
}

function renderSidebar() {
  const title = document.getElementById('sidebarTitle');
  const content = document.getElementById('sidebarContent');
  const backBtn = document.getElementById('btnBack');

  if (!currentSchool) {
    title.textContent = '选择学校';
    content.innerHTML = '<div style="padding:20px;color:var(--c-text3);font-size:13px;text-align:center">← 请先选择学校</div>';
    backBtn.style.visibility = 'hidden';
    return;
  }

  const school = SCHOOLS.find(s => s.id === currentSchool);
  if (!currentCourse) {
    // Show courses
    title.textContent = school.name;
    backBtn.style.visibility = 'hidden';
    content.innerHTML = school.courses.map(c => {
      const typeDist = {};
      ALL_Q.filter(q => q.courseId === c.id).forEach(q => { typeDist[q.type] = (typeDist[q.type]||0)+1; });
      const icons = {'tiyu':'🏥','shudian':'⚡'};
      const colors = {'tiyu':'#fef3c7','shudian':'#dbeafe'};
      return `<div class="course-card" onclick="selectCourse('${c.id}')">
        <div class="course-icon" style="background:${colors[c.id]||'#f1f5f9'}">${icons[c.id]||'📚'}</div>
        <div class="course-info">
          <div class="course-name">${c.shortName}</div>
          <div class="course-meta">${c.questionCount}题 · 判断题${typeDist['判断题']||0} · 单选${typeDist['单选题']||0} · 多选${typeDist['多选题']||0}</div>
        </div>
      </div>`;
    }).join('');
    return;
  }

  // Show modules
  const course = school.courses.find(c => c.id === currentCourse);
  title.textContent = course ? course.shortName : '模块';
  backBtn.style.visibility = 'visible';
  backBtn.onclick = () => { selectCourse(null); };

  const modules = getModules(currentCourse);
  const allCount = getCourseQuestions(currentCourse).length;
  let html = `<button class="mod-btn${currentModule==='all'?' active':''}" onclick="selectModule('all')">
    <span>📚 全部模块</span><span class="count">${allCount}</span></button>`;
  for (const mod of modules) {
    const cnt = getModuleCount(currentCourse, mod);
    html += `<button class="mod-btn${currentModule===mod?' active':''}" onclick="selectModule('${mod.replace(/'/g, "\'")}')">
      <span>${escapeHtml(mod)}</span><span class="count">${cnt}</span></button>`;
  }
  content.innerHTML = html;
}

function renderMain() {
  const breadcrumb = document.getElementById('breadcrumb');
  const main = document.getElementById('mainContent');

  // Breadcrumb
  if (!currentSchool) {
    breadcrumb.innerHTML = '<span>欢迎使用智慧树题库</span>';
    main.innerHTML = `<div class="welcome">
      <h2>🎓 智慧树题库</h2>
      <p>整合广东工业大学智慧树平台课程题库，支持搜索、题型筛选与模块浏览。请从左侧选择学校开始。</p>
      <div style="color:var(--c-text3);font-size:13px">当前收录 410 道题目 · 168 判断 · 131 单选 · 111 多选</div>
    </div>`;
    return;
  }

  const school = SCHOOLS.find(s => s.id === currentSchool);

  if (!currentCourse) {
    breadcrumb.innerHTML = `<span>${school.name}</span>`;
    const totalQ = ALL_Q.filter(q => school.courses.some(c => c.id === q.courseId)).length;
    main.innerHTML = `<div class="welcome">
      <h2>🏫 ${school.name}</h2>
      <p>共 ${school.courses.length} 门课程 · 410 道题目</p>
      <div class="course-grid">
        ${school.courses.map(c => {
          const typeDist = {};
          ALL_Q.filter(q => q.courseId === c.id).forEach(q => { typeDist[q.type] = (typeDist[q.type]||0)+1; });
          const icons = {'tiyu':'🏥','shudian':'⚡'};
          const colors = {'tiyu':'#fef3c7','shudian':'#dbeafe'};
          return `<div class="course-tile" onclick="selectCourse('${c.id}')">
            <div class="tile-icon">${icons[c.id]||'📚'}</div>
            <div class="tile-name">${c.shortName}</div>
            <div class="tile-meta">${c.questionCount}题 · 判断${typeDist['判断题']||0} 单选${typeDist['单选题']||0} 多选${typeDist['多选题']||0}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
    return;
  }

  const course = school.courses.find(c => c.id === currentCourse);
  breadcrumb.innerHTML = `<span style="cursor:pointer;color:var(--c-accent)" onclick="selectCourse(null)">${school.name}</span>
    <span>/</span><span class="current">${course.shortName}</span>`;

  const filtered = getFilteredQuestions();
  const typeCounts = {};
  getCourseQuestions(currentCourse).forEach(q => { typeCounts[q.type] = (typeCounts[q.type]||0)+1; });

  let html = '';

  // Stats
  html += `<div class="stats-bar">
    <span class="stat-chip all">📚 全部 ${getCourseQuestions(currentCourse).length}</span>
    <span class="stat-chip panduan">✓✗ 判断 ${typeCounts['判断题']||0}</span>
    <span class="stat-chip danxuan">◉ 单选 ${typeCounts['单选题']||0}</span>
    <span class="stat-chip duoxuan">☐ 多选 ${typeCounts['多选题']||0}</span>
  </div>`;

  // Toolbar
  const modules = getModules(currentCourse);
  html += `<div class="toolbar">
    <input id="searchBox" placeholder="🔍 搜索题目、答案、知识点..." value="${searchTerm.replace(/"/g,'&quot;')}" oninput="onSearch(this.value)">
    <button class="filter-btn${currentType==='all'?' active':''}" onclick="setType('all')">全部</button>
    <button class="filter-btn${currentType==='判断题'?' active':''}" onclick="setType('判断题')">判断题</button>
    <button class="filter-btn${currentType==='单选题'?' active':''}" onclick="setType('单选题')">单选题</button>
    <button class="filter-btn${currentType==='多选题'?' active':''}" onclick="setType('多选题')">多选题</button>
    <select id="moduleSelect" onchange="selectModule(this.value)" style="appearance:auto">
      <option value="all"${currentModule==='all'?' selected':''}>全部模块</option>
      ${modules.map(m => `<option value="${m.replace(/"/g,'&quot;')}"${currentModule===m?' selected':''}>${escapeHtml(m)}</option>`).join('')}
    </select>
  </div>`;

  // Results
  html += `<div class="result-info">找到 ${filtered.length} 道题目</div>`;

  if (filtered.length === 0) {
    html += `<div class="empty-state"><div class="icon">🔍</div><p>没有找到匹配的题目</p></div>`;
  } else {
    for (const q of filtered) {
      const optsHtml = q.options.length > 0
        ? `<div class="q-opts">${q.options.map((o,i) => {
            const letter = String.fromCharCode(65+i);
            const isAns = q.answer && q.answer.includes(letter);
            return `<span class="q-opt${isAns?' is-answer':''}">${escapeHtml(o)}</span>`;
          }).join('')}</div>`
        : '';
      const answerDisplay = q.answer || '?';
      const ansExtra = q.answerText ? ` (${q.answerText})` : '';
      const pointsStr = q.points ? `<span class="q-num">${q.points}分 · #${q.num}</span>` : (q.num ? `<span class="q-num">#${q.num}</span>` : '');
      html += `<div class="q-card ${q.type}">
        <div class="q-head">
          <span class="q-tag ${q.type}">${q.type}</span>
          <span class="q-module">${escapeHtml(q.module)}</span>
          ${pointsStr}
        </div>
        <div class="q-text">${escapeHtml(q.question)}</div>
        ${optsHtml}
        <div class="q-answer">
          <span class="ans-label">✅ 答案:</span>${escapeHtml(answerDisplay)}${escapeHtml(ansExtra)}
        </div>
        ${q.explanation ? `<div class="q-explain">💡 ${escapeHtml(q.explanation)}</div>` : ''}
      </div>`;
    }
  }

  main.innerHTML = html;

  // Re-attach search listener
  const searchBox = document.getElementById('searchBox');
  if (searchBox) searchBox.value = searchTerm;
}

function onSearch(val) {
  searchTerm = val;
  renderMain();
}

function setType(t) {
  currentType = t;
  renderMain();
}

// ══════════ INIT ══════════
renderAll();
</script>
</body>
</html>
