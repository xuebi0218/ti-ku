let activeType = 'all';
let activeModule = 'all';

function render() {
    const query = document.getElementById('search').value.toLowerCase().trim();
    const container = document.getElementById('cards');
    let html = '';
    let count = 0;

    for (const q of ALL) {
        // Filter by module
        if (activeModule !== 'all' && q.module !== activeModule) continue;
        // Filter by type
        if (activeType !== 'all' && q.type !== activeType) continue;
        // Filter by search
        if (query && !(q.question.includes(query) || q.answer.includes(query) || q.explanation.includes(query) || q.module.includes(query))) continue;

        count++;

        // Options HTML
        let optsHtml = '';
        for (const opt of q.options) {
            optsHtml += `<span class="option">${opt.label}.${opt.text ? ' ' + opt.text : ''}</span>`;
        }

        html += `
        <div class="card ${q.type}">
            <div class="qhead">
                <span class="qtype-tag ${q.type}">${q.type}</span>
                <span class="qmodule">${q.module}</span>
            </div>
            <div class="question">${q.question}</div>
            <div class="options">${optsHtml}</div>
            <div class="answer-box">
                <span class="label">✅ 答案：${q.answer}</span>
            </div>
            ${q.explanation ? '<div class="explain">💡 ' + q.explanation + '</div>' : ''}
        </div>`;
    }

    document.getElementById('resultCount').textContent = `共 ${count} 题`;
    container.innerHTML = html || '<div class="no-results">😕 没有匹配的题目，试试其他关键词</div>';
}

// Search
document.getElementById('search').addEventListener('input', render);

// Type filter
document.querySelectorAll('.type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeType = btn.dataset.type;
        render();
    });
});

// Module filter
document.querySelectorAll('.mod-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.mod-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeModule = btn.dataset.module;
        render();
    });
});

// Initial render
render();
</script>
